[project]
name = "adk-wealth-management"
version = "0.1.0"
description = "Google ADK Wealth Management Demo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # temporalio 1.34+ moves the ADK plugin to temporalio-google-adk, which needs google-adk 2.x.
    # Lift both caps together when migrating to google-adk 2.
    "google-adk>=1.0.0,<2",
    "pydantic>=2.11.7",
    "fastapi>=0.115.0",
    "uvicorn>=0.35.0",
    "redis>=6.2.0",
    "aiohttp>=3.12.0",
    "temporalio>=1.10.0,<1.34",
    "python-dotenv>=1.0.0",
]

[project.scripts]
adk-supervisor = "adk_supervisor.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adk_supervisor", "src/common", "src/temporal_supervisor", "src/api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
pythonpath = ["src", "."]
