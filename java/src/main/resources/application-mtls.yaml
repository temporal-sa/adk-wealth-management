# mTLS client certificate auth. The start scripts activate this profile when
# TEMPORAL_TLS_CLIENT_CERT_PATH is set; both paths are then required. Java needs the key as unencrypted
# PKCS8: TEMPORAL_KEY_PKCS8_PATH, when set, overrides TEMPORAL_TLS_CLIENT_KEY_PATH (which the Python
# worker keeps using). startcloudworker.sh checks the format.
spring:
  temporal:
    connection:
      mtls:
        cert-chain-file: ${TEMPORAL_TLS_CLIENT_CERT_PATH}
        key-file: ${TEMPORAL_KEY_PKCS8_PATH:${TEMPORAL_TLS_CLIENT_KEY_PATH}}
